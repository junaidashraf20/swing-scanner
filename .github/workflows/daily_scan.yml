name: Daily Swing Scan

on:
  schedule:
    - cron: '30 12 * * 1-5'   # Mon–Fri, 12:30 UTC = 6:00 PM IST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests jugaad-data

      - name: Run Swing Scanner
        env:
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PERSONAL:      ${{ secrets.TELEGRAM_CHAT_PERSONAL }}
          TELEGRAM_CHAT_INTERMEDIATE:  ${{ secrets.TELEGRAM_CHAT_INTERMEDIATE }}
          TELEGRAM_CHAT_BEGINNER:      ${{ secrets.TELEGRAM_CHAT_BEGINNER }}
        run: |
          python scanner.py

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_id }}
          path: scanner.log
          retention-days: 30
